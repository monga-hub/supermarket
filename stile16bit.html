<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nonna 16 bit</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141018;display:grid;place-items:center;min-height:100vh}
canvas{width:min(96vw,1024px);image-rendering:pixelated;display:block}
</style></head><body>
<canvas id="c" width="256" height="144"></canvas>
<script>
// Sprite: stringhe di pixel, una lettera = un colore. Formato riusabile nel gioco.
const PAL={k:'#1a1020',w:'#ffffff',G:'#e4e4f0',g:'#a8a8c0',s:'#f8c8a0',S:'#d89070',P:'#b070e0',p:'#7c44b8',q:'#4c2078',c:'#f0e8d0',b:'#5a3418',
 R:'#e83838',r:'#a01828',L:'#48b848',B:'#3870d8',W:'#c0c8d8',O:'#e0a050',o:'#b06828',y:'#f8d890',Y:'#f8d038',Z:'#c89818',V:'#206830',v:'#48a060'};
const SPR={
granny:["......kkkk......",".....kGGGgk.....",".....kgGggk.....","....kkkkkkkk....","...kGGGGGGGGk...","..kGGGGGGGGGgk..","..kGgssssssgGk..","..ksssssssssSk..","..kskkkskkksSk..","..kskwkskwksSk..","..ksssssssssSk..","...kssSkkSssSk..","....kkSSSSSSkk..","...kcckPPkcck...","..kPPPPPPPPPPpk.",".kPPPPwPPPPPppk.",".ksPPPPwPPPPpsk.",".kssPPPPPPPpssk.","..kkpPPPPPPpkk..","...kpPPPPPPpk...","...kqppppppqk...","....kkkkkkkk....","....kbbk.kbbk...","....kkkk.kkkk..."],
mela:["............","............","......kk....",".....kLk....","..kkkkLkkk..",".kRRRRRRrrk.",".kRwRRRRRrk.",".kRRRRRRRrk.",".kRRRRRRRrk.",".krRRRRRrrk.","..krrrrrrk..","...kkkkkk..."],
latte:["....kkkk....","...kwwwwk...","..kwwwwwwk..","..kBBBBBBk..","..kwwwwwwk..","..kwBBBBwk..","..kwBwwBwk..","..kwBBBBwk..","..kwwwwwWk..","..kwwwwwWk..","..kkkkkkkk..","............"],
pane:["............","............","...kkkkkkk..","..kOyOOyOOk.",".kOOOyOOyOok",".kOOOOOOOOok",".koOOOOOOOok",".koooooooook","..kkkkkkkkk.","............","............","............"],
formaggio:["............","............",".........kk.",".......kkYk.",".....kkYYYk.","...kkYYYYYk.",".kkYYYYYYYk.",".kYYZYYYYZk.",".kYZZYYYYYk.",".kYYYYYZYYk.",".kkkkkkkkkk.","............"],
banane:["............","..........kk",".........kbk","........kYYk",".......kYYZk","......kYYYZk","....kkYYYZk.","..kkYYYYZk..","kkYYYYYZk...","kYYYZZkk....",".kkkkk......","............"],
vino:[".....kk.....","....kbbk....","....kVVk....","....kVVk....","...kVVVVk...","..kVVVVVVk..","..kVvVVVVk..","..kccRRcck..","..kcccccck..","..kVVVVVVk..","..kkkkkkkk..","............"],
};
const cv=document.getElementById('c'),x=cv.getContext('2d');
const rect=(a,b,w,h,f)=>{x.fillStyle=f;x.fillRect(a,b,w,h)};
function spr(name,X,Y,swap={}){SPR[name].forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!=='.')rect(X+i,Y+j,1,1,swap[ch]||PAL[ch])}))}
const shadow=(X,Y,w)=>{rect(X+2,Y,w-4,1,'rgba(0,0,0,.18)');rect(X,Y+1,w,2,'rgba(0,0,0,.25)');rect(X+2,Y+3,w-4,1,'rgba(0,0,0,.18)')};

function floor(){for(let ty=1;ty<9;ty++)for(let tx=0;tx<12;tx++){const X=tx*16,Y=ty*16+12;
  rect(X,Y,16,16,(tx+ty)%2?'#f0e6cc':'#e2d4b0');rect(X,Y,16,1,'#fff8e4');rect(X,Y,1,16,'#fff8e4');rect(X,Y+15,16,1,'#c8b890');rect(X+15,Y,1,16,'#c8b890');
  if((tx*7+ty*3)%5===0){rect(X+3,Y+10,1,1,'#fffaf0');rect(X+4,Y+9,1,1,'#fffaf0');rect(X+5,Y+8,1,1,'#fffaf0')}}}
function wall(){rect(0,0,192,28,'#9cc0e0');for(let i=6;i<24;i+=6)rect(0,i,192,1,'#88aed2');rect(0,0,192,4,'#5878a8');rect(0,4,192,1,'#7c9cc8');rect(0,24,192,4,'#44546c');rect(0,24,192,1,'#6c7c98')}
function sign(X,Y,w,txt,col){rect(X+4,Y-3,1,3,'#44546c');rect(X+w-5,Y-3,1,3,'#44546c');rect(X,Y,w,11,'#1a1020');rect(X+1,Y+1,w-2,9,col);rect(X+1,Y+1,w-2,1,'rgba(255,255,255,.35)');
  x.font='8px Silkscreen';x.textAlign='center';x.textBaseline='top';x.fillStyle='#1a1020';x.fillText(txt,X+w/2+.5,Y+1.5);x.fillStyle='#fff';x.fillText(txt,X+w/2,Y+1)}
function shelf(X,Y,rows){const w=rows[0].length*16;
  shadow(X,Y+41,w);
  rect(X,Y,w,6,'#7a4a20');rect(X+1,Y,w-2,5,'#c08850');rect(X+1,Y,w-2,1,'#e8b070');
  rect(X,Y+6,w,35,'#3a200c');rect(X+2,Y+6,w-4,33,'#6a3c18');rect(X+2,Y+6,w-4,2,'#4a2810');
  rows.forEach((row,l)=>{const by=Y+22+l*16;
    row.forEach((it,i)=>{if(it)spr(it,X+i*16+2,by-12)});
    rect(X+1,by,w-2,3,'#b07840');rect(X+1,by,w-2,1,'#d8a060');rect(X+1,by+3,w-2,1,'#2a1608');
    row.forEach((it,i)=>{if(it){rect(X+i*16+6,by+1,5,2,'#f8e070');rect(X+i*16+6,by+2,5,1,'#c8a030')}})});
  rect(X,Y+6,2,35,'#a06830');rect(X+w-2,Y+6,2,35,'#5a3010')}
function hud(){rect(192,0,64,144,'#2a2238');rect(192,0,1,144,'#1a1020');
  rect(196,4,56,16,'#1a1020');rect(197,5,54,14,'#301018');x.font='8px Silkscreen';x.textAlign='center';x.textBaseline='top';
  x.fillStyle='#5a1818';x.fillText('88:88',224,8);x.fillStyle='#ff4848';x.fillText('0:42',224,8);
  rect(197,25,56,116,'#00000055');rect(196,24,56,116,'#fbf3dc');rect(196,24,56,1,'#fffdf4');rect(206,24,1,116,'#f0a0a0');
  x.fillStyle='#2848a8';x.textAlign='left';x.fillText('Lista',210,27);
  ['mela','latte','pane','formaggio','vino','banane'].forEach((it,i)=>{const Y=40+i*16;rect(197,Y+13,54,1,'#c8d8f0');spr(it,212,Y);
    rect(236,Y+3,9,9,'#2848a8');rect(237,Y+4,7,7,'#fbf3dc');
    if(i<2){const ck=[[238,8],[239,9],[240,10],[241,9],[242,8],[243,7],[244,6],[245,5]];ck.forEach(([a,b])=>rect(a,Y+b-1,1,2,'#d82828'));rect(211,Y+6,24,1,'#d82828')}})}

function draw(){
  rect(0,0,256,144,'#000');floor();wall();
  sign(14,6,46,'FRUTTA','#2c8a48');sign(70,6,52,'DISPENSA','#c86020');sign(132,6,52,'LATTICINI','#3870d8');
  shelf(8,30,[['mela','mela','banane','banane','mela','banane'],['banane','mela','mela',null,'banane','mela']]);
  shelf(120,30,[['latte','formaggio','latte','formaggio'],['formaggio','latte',null,'latte']]);
  shadow(146,101,14);spr('granny',145,78,{G:'#b07040',g:'#80502a',P:'#58b858',p:'#308a38',q:'#1c5c24',w:'#f0e060'});
  shadow(90,107,14);spr('granny',89,84);
  rect(106,96,12,10,'#1a1020');rect(107,97,10,8,'#f0c048');rect(107,97,10,1,'#f8e090');rect(109,98,1,7,'#b88020');rect(112,98,1,7,'#b88020');rect(115,98,1,7,'#b88020');rect(108,92,8,1,'#1a1020');rect(107,93,1,3,'#1a1020');rect(116,93,1,3,'#1a1020');spr('pane',106,84);
  shelf(8,104,[['pane','vino','pane','vino','pane'],['vino','pane','vino','pane','vino']]);
  shelf(144,104,[['vino','vino','pane'],['pane','vino','vino']]);
  hud();
}
document.fonts.load('8px Silkscreen').finally(draw);
</script></body></html>
